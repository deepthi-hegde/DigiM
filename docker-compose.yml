version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
